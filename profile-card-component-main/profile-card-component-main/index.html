<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen flex justify-center items-center bg-teal-500 relative">
    <!-- Gradient Overlay -->
    <div
      class="absolute inset-0 bg-gradient-to-br from-teal-500 to-teal-400 opacity-80"
    ></div>

    <!-- Top Bg spehere -->
    <img
      src="./images/bg-pattern-top.svg"
      alt="top pattern"
      class="absolute top-[-20%] left-[-10%] w-[50vw] max-w-none opacity-40"
    />

    <!-- Bottom Bg spehre -->
    <img
      src="./images/bg-pattern-bottom.svg"
      alt="bottom pattern"
      class="absolute bottom-[-20%] right-[-10%] w-[50vw] max-w-none opacity-40"
    />

    <!-- Profile Card -->
    <div class="relative bg-white w-80 rounded-lg shadow-xl">
      <!-- Card Background Image -->
      <div class="relative">
        <img
          src="./images/bg-pattern-card.svg"
          alt=""
          class="w-full rounded-t-lg"
        />
        <div class="absolute left-1/2 transform -translate-x-1/2 -bottom-10">
          <img
            src="./images/image-victor.jpg"
            alt=""
            class="w-20 h-20 rounded-full border-4 border-white"
          />
        </div>
      </div>

      <!-- Profile Info -->
      <div class="pt-12 text-center">
        <h2 class="text-gray-800 font-bold text-lg">
          Victor Crest <span class="text-gray-400 font-normal">26</span>
        </h2>
        <p class="text-gray-500 text-sm">London</p>
      </div>

      <!-- Stats Section -->
      <div class="flex justify-around border-t mt-4 p-4 text-center">
        <div>
          <h3 class="text-gray-900 font-bold text-lg">80K</h3>
          <p class="text-gray-500 text-xs">Followers</p>
        </div>
        <div>
          <h3 class="text-gray-900 font-bold text-lg">803K</h3>
          <p class="text-gray-500 text-xs">Likes</p>
        </div>
        <div>
          <h3 class="text-gray-900 font-bold text-lg">1.4K</h3>
          <p class="text-gray-500 text-xs">Photos</p>
        </div>
      </div>
      <h4
        class="text-gray-900 font-bold text-sm flex items-center justify-center mb-6 mt-4"
      >
        Coded by nupoor_k :)
      </h4>
    </div>
  </body>
</html>
