<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white">
    <!-- Navbar -->
    <div class="bg-white flex items-center justify-between px-10 py-4" id="nav">
      <!-- Left Section: Logo + Nav Links -->
      <div class="flex items-center space-x-10">
        <!-- Logo -->
        <img src="./images/logo.svg" alt="Logo" class="h-6" />

        <!-- Desktop Navigation Links (Hidden on Mobile) -->
        <nav class="hidden md:flex items-center space-x-6 text-gray-700">
          <!-- Features Dropdown -->
          <div class="relative group">
            <div
              class="flex items-center gap-1 font-medium cursor-pointer hover:text-black"
            >
              Features
              <img src="./images/icon-arrow-down.svg" alt="Dropdown" />
            </div>
            <div
              class="absolute left-0 mt-2 w-40 bg-white shadow-lg rounded-lg p-3 space-y-2 hidden group-hover:block"
            >
              <a
                href="#"
                class="flex flex-row-reverse items-center gap-2 text-gray-700 hover:text-black mr-5"
              >
                <img src="./images/icon-todo.svg" alt="" class="w-5 mr-6" />
                Todo List
              </a>
              <a
                href="#"
                class="flex flex-row-reverse items-center gap-2 text-gray-700 hover:text-black mr-5"
              >
                <img src="./images/icon-calendar.svg" alt="" class="w-5 mr-6" />
                Calendar
              </a>
              <a
                href="#"
                class="flex flex-row-reverse items-center gap-2 text-gray-700 hover:text-black mr-5"
              >
                <img
                  src="./images/icon-reminders.svg"
                  alt=""
                  class="w-5 mr-6"
                />
                Reminders
              </a>
              <a
                href="#"
                class="flex flex-row-reverse items-center gap-2 text-gray-700 hover:text-black mr-5"
              >
                <img src="./images/icon-planning.svg" alt="" class="w-5 mr-6" />
                Planning
              </a>
            </div>
          </div>

          <!-- Company Dropdown -->
          <div class="relative group">
            <div
              class="flex items-center gap-1 font-medium cursor-pointer hover:text-black"
            >
              Company
              <img src="./images/icon-arrow-down.svg" alt="Dropdown" />
            </div>
            <div
              class="absolute left-0 mt-2 w-32 bg-white shadow-lg rounded-lg p-3 flex flex-col items-start space-y-2 hidden group-hover:flex"
            >
              <a href="#" class="text-gray-700 hover:text-black">History</a>
              <a href="#" class="text-gray-700 hover:text-black">Our Team</a>
              <a href="#" class="text-gray-700 hover:text-black">Blog</a>
            </div>
          </div>

          <div class="font-medium cursor-pointer hover:text-black">Careers</div>
          <div class="font-medium cursor-pointer hover:text-black">About</div>
        </nav>
      </div>

      <!-- Right Section: Buttons (Hidden on Mobile) -->
      <div class="hidden md:flex items-center space-x-6">
        <button class="text-gray-500 hover:text-black">Login</button>
        <button
          class="border border-gray-500 rounded-2xl px-5 py-2 text-white bg-black hover:border-white hover:text-white"
        >
          Register
        </button>
      </div>

      <!-- Hamburger Menu (Visible on Mobile) -->
      <button id="menu-btn" class="md:hidden">
        <img src="./images/icon-menu.svg" alt="Menu" class="w-6 h-6" />
      </button>
    </div>

    <!-- Mobile Menu (Initially Hidden) -->
    <div
      id="mobile-menu"
      class="hidden md:hidden flex flex-col items-center bg-white shadow-md py-4 space-y-4"
    >
      <a href="#" class="text-gray-700 hover:text-black">Features</a>
      <a href="#" class="text-gray-700 hover:text-black">Company</a>
      <a href="#" class="text-gray-700 hover:text-black">Careers</a>
      <a href="#" class="text-gray-700 hover:text-black">About</a>
      <hr class="w-4/5 border-gray-300" />
      <button class="text-gray-500 hover:text-black">Login</button>
      <button
        class="border border-gray-500 rounded-2xl px-5 py-2 text-white bg-black hover:border-white hover:text-white"
      >
        Register
      </button>
    </div>

    <!-- Hero Section -->
    <div
      class="flex flex-col md:flex-row items-center justify-between px-10 py-16 max-w-6xl mx-auto"
    >
      <!-- Left Side (Text) -->
      <div class="w-full md:w-1/2 space-y-7 text-center md:text-left">
        <h1 class="text-5xl font-bold leading-tight">
          Make <br />
          Remote Work
        </h1>
        <p class="text-gray-600 text-lg">
          Get your team in sync, no matter your location. <br />
          Streamline processes, create team rituals, <br />
          and watch productivity soar.
        </p>
        <button
          class="bg-black text-white rounded-lg px-6 py-3 hover:bg-white hover:text-black border border-black"
        >
          Learn More
        </button>
        <div class="flex justify-center md:justify-start gap-3 mr-7 mb-4">
          <img src="./images/client-databiz.svg" alt="" />
          <img src="./images/client-audiophile.svg" alt="" />
          <img src="./images/client-maker.svg" alt="" />
          <img src="./images/client-meet.svg" alt="" />
        </div>
      </div>

      <!-- Right Side (Image) -->
      <div class="w-full md:w-1/2 flex justify-center md:justify-end">
        <img
          src="./images/image-hero-desktop.png"
          alt="Hero Image"
          class="w-full max-w-md object-cover"
        />
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"
      integrity="sha512-f6bQMg6nkSRw/xfHw5BCbISe/dJjXrVGfz9BSDwhZtiErHwk7ifbmBEtF9vFW8UNIQPhV2uEFVyI/UHob9r7Cw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="script.js"></script>
  </body>
</html>
